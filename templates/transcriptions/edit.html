{% extends "base.html" %}
{% block content %}
<h2 class="fw-bold mb-4">Edit transcription</h2>
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<form method="post">{% csrf_token %}
{% for field in form %}
<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
{% endfor %}
<button class="btn btn-primary">Save changes</button>
<a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a>
</form>
</div></div>
{% endblock %}
