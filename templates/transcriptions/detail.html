{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold">{{ record.title }}</h2><p class="text-secondary mb-0">{{ record.created_at|date:"d M Y, h:i A" }} · {{ record.language|upper }}</p></div><a class="btn btn-outline-dark" href="{% url 'dashboard' %}">Back</a></div>
<div class="card border-0 shadow-sm"><div class="card-body p-4"><p class="transcript-detail">{{ record.text }}</p><a class="btn btn-primary" href="{% url 'update' record.pk %}">Edit transcription</a></div></div>
{% endblock %}
